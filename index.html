<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Spelling Fun: ed and ing</title>
<style>
:root{--bg:#fff8e7;--card:#fff;--ink:#2b2a4c;--pri:#e8590c;--ok:#2e9e5b;--no:#e5484d;--soft:#ffe9b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1d33;--card:#2b2a4c;--ink:#fff8e7;--soft:#3b3963}}
:root[data-theme="dark"]{--bg:#1e1d33;--card:#2b2a4c;--ink:#fff8e7;--soft:#3b3963}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;text-align:center;padding:16px}
.w{max-width:560px;margin:0 auto}h1{font-size:1.6rem;margin:6px 0}.sub{opacity:.85;margin:0 0 12px}
.bar{height:14px;background:var(--soft);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .4s}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.q{font-size:1.35rem;margin:6px 0 14px;line-height:1.4}.big{font-size:2rem;color:var(--pri);font-weight:bold}
button{font:inherit;cursor:pointer}.o{display:block;width:100%;margin:10px 0;padding:14px;font-size:1.3rem;border-radius:16px;border:3px solid var(--pri);background:var(--card);color:var(--ink)}
.o:active{transform:scale(.98)}.o.ok{background:var(--ok);border-color:var(--ok);color:#fff}.o.no{background:var(--no);border-color:var(--no);color:#fff}
.go{padding:14px 30px;font-size:1.3rem;border:0;border-radius:30px;background:var(--pri);color:#fff;margin-top:8px}
.fb{min-height:3.2em;font-size:1.15rem;margin-top:6px}.top{display:flex;justify-content:space-between;font-size:1.1rem}
</style></head><body><div class="w"><h1>✏️ Spelling Fun: ed and ing</h1><p class="sub">Year 3 · A party in India · Page 53</p>
<div id="app"></div></div>
<script>
var Q=[{"q": "Add the ending: <span class=\"big\">wait + ing</span>", "o": ["waiting", "waitting", "wating"], "t": "Long vowel sound (ai): just add ing!", "tag": "Which spelling is correct?"}, {"q": "Add the ending: <span class=\"big\">skip + ed</span>", "o": ["skipped", "skiped", "skipted"], "t": "Short vowel sound: double the last letter, then add ed!", "tag": "Which spelling is correct?"}, {"q": "Add the ending: <span class=\"big\">dance + ing</span>", "o": ["dancing", "danceing", "dannceing"], "t": "Ends in e: remove the e, then add ing!", "tag": "Which spelling is correct?"}, {"q": "Add the ending: <span class=\"big\">drop + ing</span>", "o": ["dropping", "droping", "dropeing"], "t": "Short vowel sound: double the p!", "tag": "Which spelling is correct?"}, {"q": "Add the ending: <span class=\"big\">boat + ing</span>", "o": ["boating", "boatting", "botting"], "t": "Long vowel sound (oa): just add ing!", "tag": "Which spelling is correct?"}, {"q": "Add the ending: <span class=\"big\">decorate + ed</span>", "o": ["decorated", "decorateed", "decoratted"], "t": "Ends in e: remove the e, then add ed!", "tag": "Which spelling is correct?"}, {"q": "Add the ending: <span class=\"big\">swap + ed</span>", "o": ["swapped", "swaped", "swapted"], "t": "Short vowel sound: double the p!", "tag": "Which spelling is correct?"}, {"q": "Add the ending: <span class=\"big\">cook + ed</span>", "o": ["cooked", "cookked", "coked"], "t": "Long oo sound: just add ed!", "tag": "Which spelling is correct?"}, {"q": "Add the ending: <span class=\"big\">sail + ing</span>", "o": ["sailing", "sailling", "saling"], "t": "Long vowel sound (ai): just add ing!", "tag": "Which spelling is correct?"}, {"q": "Add the ending: <span class=\"big\">prance + ed</span>", "o": ["pranced", "prancced", "pranceed"], "t": "Ends in e: remove the e, then add ed!", "tag": "Which spelling is correct?"}, {"q": "Which word has a <b>long vowel sound</b>?", "o": ["boat", "skip", "drop"], "t": "boat has the long oa sound.", "tag": "Think and choose!"}, {"q": "Which word has a <b>short vowel sound</b>?", "o": ["skip", "wait", "boat"], "t": "skip has a short i sound.", "tag": "Think and choose!"}, {"q": "What do we do with <b>dance + ed</b>?", "o": ["Remove the e, then add ed", "Double the last letter", "Just add ed"], "t": "dance ends in e, so remove the e first!", "tag": "Think and choose!"}, {"q": "What do we do with <b>drop + ing</b>?", "o": ["Double the last letter, then add ing", "Just add ing", "Remove the e"], "t": "drop has a short vowel sound, so double the p!", "tag": "Think and choose!"}, {"q": "What is <b>alliteration</b>?", "o": ["Words close together that start with the same sound", "Two lines that rhyme", "A kind of Indian food"], "t": "Alliteration repeats a starting sound.", "tag": "Think and choose!"}, {"q": "Which sound repeats in <i>decorated, delicate, donkeys</i>?", "o": ["The d sound", "The m sound", "The s sound"], "t": "All three start with the d sound.", "tag": "Think and choose!"}, {"q": "Which sentence uses alliteration?", "o": ["Dancing donkeys danced all day.", "The big tiger ran home.", "I like my new pen."], "t": "Dancing, donkeys, danced and day all start with d!", "tag": "Think and choose!"}, {"q": "What is the poem <i>Mela Menagerie</i> about?", "o": ["Animals having a festival in India", "Children at school", "A trip on a boat"], "t": "The animals are having a mela, a fair!", "tag": "Think and choose!"}, {"q": "Add <b>ed</b> to <b>wait</b>", "o": ["waited", "waitted", "waitd"], "t": "Long vowel sound: just add ed!", "tag": "Think and choose!"}, {"q": "Add <b>ing</b> to <b>skip</b>", "o": ["skipping", "skiping", "skipeing"], "t": "Short vowel sound: double the p!", "tag": "Think and choose!"}];var i=0,s=0,lock=false,app=document.getElementById("app");
function sh(a){return a.map(function(x){return[Math.random(),x]}).sort(function(a,b){return a[0]-b[0]}).map(function(p){return p[1]})}
function start(){i=0;s=0;Q=sh(Q);show()}
function intro(){app.innerHTML='<div class="card"><div class="big">🐘✨</div><p class="q">Add ed or ing to each word. Choose the correct spelling!</p><button class="go" onclick="start()">Let’s play! ▶</button></div>'}
function show(){lock=false;var q=Q[i];var os=sh(q.o.map(function(t,k){return{t:t,k:k}}));
var h='<div class="top"><span>Question '+(i+1)+' / '+Q.length+'</span><span>⭐ '+s+'</span></div><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><div class="card">'+(q.tag?'<div class="sub">'+q.tag+'</div>':'')+'<p class="q">'+q.q+'</p>';
os.forEach(function(o){h+='<button class="o" data-k="'+o.k+'">'+o.t+'</button>'});
app.innerHTML=h+'<div class="fb" id="fb"></div></div>';
Array.prototype.forEach.call(app.querySelectorAll(".o"),function(b){b.onclick=function(){pick(b)}})}
function pick(b){if(lock)return;lock=true;var q=Q[i],ok=+b.dataset.k===0;
Array.prototype.forEach.call(app.querySelectorAll(".o"),function(x){if(+x.dataset.k===0)x.classList.add("ok")});
if(ok){s++;document.getElementById("fb").innerHTML='🎉 Great job! '+q.t}else{b.classList.add("no");document.getElementById("fb").innerHTML='💪 Nice try! '+q.t}
var n=document.createElement("button");n.className="go";n.textContent=i+1<Q.length?"Next ▶":"Finish 🏁";n.onclick=function(){i++;i<Q.length?show():end()};app.firstChild.nextSibling&&0;document.querySelector(".card").appendChild(n)}
function end(){var st=s>=Q.length*.8?"🏆 Superstar!":s>=Q.length*.5?"🌟 Well done!":"🌈 Good try! Play again!";
app.innerHTML='<div class="card"><div class="big">'+st+'</div><p class="q">You got '+s+' out of '+Q.length+' stars!</p><button class="go" onclick="start()">Play again 🔁</button></div>'}
intro();
</script></body></html>
